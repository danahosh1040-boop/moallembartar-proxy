<!doctype html><html lang="fa"><meta charset="utf-8"><title>تست دانلود</title><body style="font-family:sans-serif;text-align:center;padding:40px"><h2>در حال دانلود فایل آزمایشی…</h2><div id="r" style="font-size:24px;margin-top:20px"></div><script>const t=Date.now();fetch('https://threejs.org/build/three.module.js').then(r=>r.blob()).then(b=>{document.getElementById('r').textContent='✅ موفق! '+(b.size/1048576).toFixed(2)+' MB در '+((Date.now()-t)/1000).toFixed(1)+' ثانیه';}).catch(e=>{document.getElementById('r').textContent='❌ ناموفق: '+e.message;});</script></body></html>
